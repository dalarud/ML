listrantor = { "3M" = 3.59, "1Y" = 3.74, "2Y" = 3.84, "3Y" = 3.94, "5Y" = 4.14, "10Y" = 4.44 }
rabatter   = { "3M" = 0.85, "1Y" = 0.60, "2Y" = 0.50, "3Y" = 0.50, "5Y" = 0.45, "10Y" = 0.35 }
flyttkostnad = 1_500
befintlig_kund_rabattandel = 0.6

[[bank]]
