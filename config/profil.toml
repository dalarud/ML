# EXEMPELPROFIL med påhittade belopp. Kopiera till config/min_profil.toml och fyll i dina
# egna siffror – den filen används automatiskt och committas inte (se .gitignore).
# Räntor anges i procent, rabatter i procentenheter (pe), belopp i kronor.
#
# Bindningstider: "3M" (rörlig), "1Y", "2Y", "3Y", "5Y", "10Y"

[lan]
belopp = 3_000_000
bostadsvarde = 4_000_000
horisont_ar = 10                 # planeringshorisont
amorteringskrav = true           # 2 % över 70 % belåning, 1 % mellan 50–70 % (beräknas automatiskt)
amortering_per_ar = 0            # frivillig amortering per år (används om den är högre än kravet)
bostad_prisutveckling = 0.0      # %/år vid omvärdering vart 5:e år (0 = försiktigt)
nuvarande_tenor = "3M"           # vad du har idag
nuvarande_ranta = 2.85           # din nuvarande ränta
bundet_kvar_manader = 0          # månader kvar till villkorsändringsdag (0 = rörligt/fritt)
ranteavdrag = true               # 30 % upp till 100 000 kr räntekostnad per låntagare, 21 % därutöver
antal_lantagare = 2
diskonteringsranta = 2.0         # för nuvärdesberäkning (%/år) om alternativ_avkastning saknas
# Alternativkostnader
alternativ_avkastning = 2.5       # %/år efter skatt på pengar som annars kunnat placeras (sparkonto ~2, ISK/fond ~4–5)
sannolikhet_losen_ar = 0.03       # årlig sannolikhet att lånet löses i förtid (flytt/försäljning) → RSE vid bundet
rse_paslag = 1.0                 # påslag i jämförelseräntan för ränteskillnadsersättning (kontrollera med banken)

# Hushållets ekonomi (kvar-att-leva-på-kalkyl)
bruttoinkomst_manad = 70_000     # hushållets samlade lön före skatt
nettoinkomst_manad = 53_000      # efter skatt
ovriga_boendekostnader_manad = 4_500   # drift/avgift, el, vatten, försäkring
levnadskostnader_manad = 20_000        # mat, kläder, transport m.m.

[risk]
riskaversion = 0.25              # λ: 0 = bara förväntad kostnad, 0.25 = balanserad, 0.5 = försiktig, 1+ = mycket försiktig
cvar_niva = 0.95                 # CVaR95 = snittet av de 5 % sämsta scenarierna
scenarier = 3000

# Ett [[bank]]-block per bank/erbjudande. Listräntor från bankens webb,
# rabatter från ditt erbjudande (eller bankens "snittränta" − listränta).
# befintlig_kund_rabattandel: andel av rabatten du får vid ny räntesättning om du
# INTE förhandlar (används i "passiva" strategier).

[[bank]]
# Listräntor hämtade från handelsbanken.se 2026-11-07.
# 3M-rabatten (1,34) är din egen. För bundna tider är rabatten uppskattad som
# Handelsbankens listränta − deras snittränta okt 2026 (vad kunder i snitt fick).
# Byt mot din egen offert när du har en. "10Y" använder Handelsbankens 10-årsränta.
namn = "Handelsbanken"
nuvarande = true
listrantor = { "3M" = 4.19, "1Y" = 3.69, "2Y" = 3.94, "3Y" = 3.99, "5Y" = 4.19, "10Y" = 4.40 }
rabatter   = { "3M" = 1.34, "1Y" = 0.52, "2Y" = 0.44, "3Y" = 0.49, "5Y" = 0.19, "10Y" = 0.12 }
flyttkostnad = 0
befintlig_kund_rabattandel = 0.6

